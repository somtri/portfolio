name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # No secrets are set for this job on purpose. The build must succeed
      # offline with no environment variables; the assistant falls back to
      # its full-context path when the provider keys are absent.
      - name: Build
        run: pnpm build
