<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    The site mark, dark theme: Hack Bold's ">" - the same glyph the ask widget
    prompts with. The outline is traced from the font (scratchpad
    brand/measure.js reads the rendered glyph mask row by row), then centred on
    48,48 and made symmetric, so the mark needs no webfont to draw.

    Colours are the site's own paper and accent tokens for this theme. The pair
    of files is deliberate: components/TabIcon.tsx swaps between them on the
    site's theme toggle, so a favicon cannot carry a media query here.
    (No double hyphens in this comment: XML forbids them, and a malformed
    comment silently breaks the whole file.)
  -->
  <rect fill="#000000" width="96" height="96" />
  <path fill="#2f6bff" d="M29 28.81 L67 43.75 L67 52.25 L29 67.19 L29 58.19 L57.63 48 L29 37.81 Z" />
</svg>
